<VirtualHost *:8080>
    DocumentRoot /var/www/public
    ServerName multi-tax.onrender.com

    <Directory /var/www/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    SetEnvIf Origin "^https://multi-tax-gold\.vercel\.app$" CORS_ORIGIN=$0
    SetEnvIf Origin "^http://localhost:3000$" CORS_ORIGIN=$0

    Header always set Access-Control-Allow-Origin "%{CORS_ORIGIN}e" env=CORS_ORIGIN
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-XSRF-TOKEN"
    Header always set Access-Control-Allow-Credentials "true"

    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

Listen 8080
